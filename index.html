<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한자 암기 도구</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#1c2b30;--sub:#5b6b70;--jade:#2c7a69;--jade2:#e0efeb;--red:#c4402f;--red2:#fbe7e3;--line:#d3dbd9}
@media(prefers-color-scheme:dark){:root{--bg:#131a1c;--card:#1c2528;--ink:#e8efee;--sub:#9db0b4;--jade:#5cc0a8;--jade2:#1d3a33;--red:#ef7968;--red2:#3b1f1b;--line:#33413f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.han{font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif}
header{padding:16px 18px 6px}h1{font-size:20px;margin:0}
nav{display:flex;gap:6px;padding:8px 18px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--jade);border-color:var(--jade);color:#fff}
#wc{font-size:12px;background:var(--red);color:#fff;border-radius:9px;padding:1px 7px;margin-left:4px}
main{max-width:720px;margin:0 auto;padding:8px 18px 40px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--sub);font-size:14px}
.bar .cnt{margin-left:auto}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fc{cursor:pointer}.fc.back{border-color:var(--jade)}
.mean{font-size:26px;font-weight:600}.py{font-size:20px;color:var(--jade)}
.hz{font-size:64px;line-height:1.2}.ex{color:var(--sub);font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:8px;font:inherit;cursor:pointer}
.btn.pri{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.bad{background:var(--red2);border-color:var(--red);color:var(--red)}
.btn.good{background:var(--jade2);border-color:var(--jade);color:var(--jade)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{font-size:34px;padding:16px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer}
.opt.ok{border-color:var(--jade);background:var(--jade2)}.opt.no{border-color:var(--red);background:var(--red2)}
#ans{font-size:30px;width:100%;text-align:center;margin:12px 0}
.fb{border-radius:12px;padding:14px;margin:12px 0;text-align:center}.fb.ok{background:var(--jade2)}.fb.no{background:var(--red2)}
.fb .hz{font-size:48px}.bd{color:var(--red);font-weight:700}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .hz{font-size:28px;min-width:90px}.row .m{flex:1;font-size:14px}.row .m b{color:var(--jade);font-weight:500}
.x{border:0;background:none;color:var(--sub);font-size:20px;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
details.pad{margin-top:10px}summary{cursor:pointer;color:var(--sub)}
canvas{touch-action:none;width:100%;height:220px;margin-top:8px;border:1px solid var(--line);border-radius:10px;
background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,var(--card)}
label{display:inline-flex;gap:6px;align-items:center}
.set{display:grid;gap:12px;margin:10px 0}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
</style></head><body>

<nav>
<button data-t="card" onclick="go('card')">플래시카드</button>

<button data-t="wrong" onclick="go('wrong')">오답 노트<span id="wc">0</span></button>

加油|jiāyóu|힘내라, 파이팅||如油/加由/加沺|발음

明天见|míngtiān jiàn|내일 만나|明天见！|朋天见/明夫见/明天贝|1과

还好|hái hǎo|그럭저럭 지내다||还奸/迂好/还如|필기
早安|zǎo'ān|(아침 인사) 안녕||旱安/早按/早字|필기

没什么|méi shénme|별거 아니에요||设什么/没什公/没仕么|필기
法国|Fǎguó|프랑스||发国/法园/去国|필기
那|nà|저, 저것||哪/邦/娜|필기

包|bāo|가방||句/勺/色|필기

谁|shéi|누구||难/准/推|필기

伤心|shāngxīn|슬프다||仿心/伤必/场心|필기

哪|nǎ|어느 (의문사)|你是哪国人？|那/娜/部|2과
国|guó|나라||园/因/围|2과
人|rén|사람||入/八/大|2과
韩国|Hánguó|한국||韩园/辅国/韩囯|2과
韩国人|Hánguórén|한국인|我是韩国人。|韩园人/辅国人/韩国入|2과
也|yě|~도, 또한|你也是韩国人吗？|他/地/池|2과
中国|Zhōngguó|중국||中园/申国/中囯|2과

意大利|Yìdàlì|이탈리아||竟大利/意太利/意大梨|2과
墨西哥|Mòxīgē|멕시코||黑西哥/墨酉哥/墨西歌|2과
加拿大|Jiānádà|캐나다||如拿大/加拿太/加挚大|2과
叫|jiào|(~라고) 부르다|我叫王丽娜。|吗/川/叶|2과
认识|rènshi|알다 (사람을 알다)|认识你很高兴。|认织/忍识/认只|2과

呢|ne|~는요? (의문)|我叫金东海，你呢？|昵/泥/呕|2과
这|zhè|이, 이것|这是什么？|边/过/远|2과
手机|shǒujī|휴대 전화|这是手机。|手几/毛机/手杭|2과
书|shū|책||节/韦/乍|2과
杯子|bēizi|컵||怀子/林子/杯字|2과
饿|è|배고프다|我很饿。|我/俄/峨|2과
累|lèi|피곤하다|我很累。|果/絮/索|2과
幸福|xìngfú|행복하다|我很幸福。|辛福/幸祸/幸副|2과
日本|Rìběn|일본||曰本/目本/日木|2과
英国|Yīngguó|영국||央国/英园/苗国|2과
西班牙|Xībānyá|스페인||西班才/酉班牙/西斑牙|2과
忙|máng|바쁘다||盲/亡/忘|2과
紧张|jǐnzhāng|긴장하다||坚张/紧长/紧弓|2과

const parseRows=t=>t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const s=l.includes('\t')?'\t':l.includes('|')?'|':',';const a=l.split(s).map(x=>x.trim());return{h:a[0],p:a[1]||'',m:a[2]||'',e:a[3]||'',x:(a[4]||'').split('/').map(x=>x.trim()).filter(Boolean),g:a[5]||''}}).filter(r=>r.h);
const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let V=ld(KV,null)||parseRows(SEED),W=ld(KW,{}),tab='card';
const S={fc:{order:[],i:0,flip:false,front:'both',wrongOnly:false},q:{type:'input',ask:'meaning',wrongOnly:false,phase:'setup',pool:[],i:0,ok:0,ans:null,opts:[]},pad:false,unit:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=wo=>V.filter(w=>(!wo||W[w.h])&&(!S.unit||w.g===S.unit));
const units=()=>[...new Set(V.map(w=>w.g).filter(Boolean))];
const unitOpts=()=>opt('',S.unit,'전체')+units().map(u=>opt(u,S.unit,u)).join('');
const opt=(v,cur,t)=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`;
const speak=h=>{try{const u=new SpeechSynthesisUtterance(h);u.lang='zh-CN';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function go(t){tab=t;if(t==='card')fcStart();render()}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ({card:rCard,quiz:rQuiz,wrong:rWrong,manage:rManage})[tab]();
 $('#wc').textContent=V.filter(w=>W[w.h]).length;initCanvas();
}
/* 플래시카드 */
function fcStart(wo){const f=S.fc;if(wo!==undefined)f.wrongOnly=wo;f.order=shuf(pool(f.wrongOnly));f.i=0;f.flip=false}
function cardInner(w){const f=S.fc;
 if(f.flip)return `<div class="hz han">${esc(w.h)}</div><div class="py">${esc(w.p)}</div><div class="ex han">${esc(w.e)}</div>`;
 return (f.front!=='pinyin'?`<div class="mean">${esc(w.m)}</div>`:'')+(f.front!=='meaning'?`<div class="py">${esc(w.p)}</div>`:'')+`<div class="ex">탭해서 한자 확인</div>`}
function rCard(){const f=S.fc,w=f.order[f.i];
 let h=`<div class="bar"><label>범위 <select onchange="S.unit=this.value;fcStart();render()">${unitOpts()}</select></label><label>앞면 <select onchange="S.fc.front=this.value;S.fc.flip=false;render()">${opt('both',f.front,'뜻+병음')}${opt('meaning',f.front,'뜻만')}${opt('pinyin',f.front,'병음만')}</select></label>
 <label><input type="checkbox" ${f.wrongOnly?'checked':''} onchange="fcStart(this.checked);render()">오답만</label><span class="cnt">${f.order.length?f.i+1:0} / ${f.order.length}</span></div>`;
 if(!w)h+=`<div class="empty">${f.wrongOnly?'오답 노트가 비어 있어요.':'단어가 없어요. 단어 관리에서 추가하세요.'}</div>`;
 else h+=`<div class="card fc ${f.flip?'back':''}" id="fcc" onclick="fcFlip()">${cardInner(w)}</div>
 <div class="btns"><button class="btn" onclick="fcNext(-1)">이전</button><button class="btn bad" onclick="fcMark(true)">헷갈려요</button><button class="btn good" onclick="fcMark(false)">외웠어요</button><button class="btn" onclick="fcNext(1)">다음</button><button class="btn" onclick="speak(S.fc.order[S.fc.i].h)">발음 듣기</button></div>${padHTML()}`;
 $('#main').innerHTML=h}
function fcFlip(){const f=S.fc;f.flip=!f.flip;const c=$('#fcc');c.className='card fc '+(f.flip?'back':'');c.innerHTML=cardInner(f.order[f.i])}
function fcNext(d){const f=S.fc,n=f.order.length;f.i=(f.i+d+n)%n;f.flip=false;render()}
function fcMark(bad){const w=S.fc.order[S.fc.i];if(bad)W[w.h]=(W[w.h]||0)+1;else delete W[w.h];sv(KW,W);fcNext(1)}
document.addEventListener('keydown',e=>{if(tab!=='card'||!S.fc.order.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(e.key==='ArrowRight')fcNext(1);else if(e.key==='ArrowLeft')fcNext(-1);else if(e.key===' '){e.preventDefault();fcFlip()}});
/* 퀴즈 */
function rQuiz(){const q=S.q;
 if(q.phase==='setup'){$('#main').innerHTML=`<div class="set">
 <label>범위 <select onchange="S.unit=this.value">${unitOpts()}</select></label>
 <label>유형 <select onchange="S.q.type=this.value">${opt('input',q.type,'한자 직접 입력')}${opt('choice',q.type,'객관식(한자 구별)')}</select></label>
 <label>문제 <select onchange="S.q.ask=this.value">${opt('meaning',q.ask,'뜻')}${opt('pinyin',q.ask,'병음')}${opt('both',q.ask,'뜻+병음')}</select></label>
 <label><input type="checkbox" ${q.wrongOnly?'checked':''} onchange="S.q.wrongOnly=this.checked">오답 노트 단어만</label></div>
 <button class="btn pri" onclick="qStart()">시작</button>`;return}
 if(q.phase==='end'){const n=q.pool.length;$('#main').innerHTML=`<div class="card"><div class="mean">${q.ok} / ${n} 정답</div><div class="ex">틀린 한자는 오답 노트에 저장됐어요.</div></div>
 <div class="btns"><button class="btn pri" onclick="qStart()">다시 풀기</button><button class="btn" onclick="S.q.phase='setup';render()">설정으로</button><button class="btn" onclick="go('wrong')">오답 노트</button></div>`;return}
 const w=q.pool[q.i],a=q.ans;
 let h=`<div class="bar"><span>${q.i+1} / ${q.pool.length}</span><span class="cnt">정답 ${q.ok}</span></div><div class="card">`+
 (q.ask!=='pinyin'?`<div class="mean">${esc(w.m)}</div>`:'')+(q.ask!=='meaning'?`<div class="py">${esc(w.p)}</div>`:'')+`<div class="ex">알맞은 한자는?</div></div>`;
 if(q.type==='choice'){h+=`<div class="opts">`+q.opts.map((o,i)=>{let c='';if(a){if(o===w.h)c='ok';else if(o===a.val)c='no'}
  return `<button class="opt han ${c}" ${a?'disabled':''} onclick="qCheck(${i})">${esc(o)}</button>`}).join('')+`</div>`}
 else h+=`<input type="text" id="ans" class="han" lang="zh" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한자를 입력" ${a?'disabled value="'+esc(a.val)+'"':''} onkeydown="if(event.key==='Enter')qCheck()">
  ${a?'':'<button class="btn pri" onclick="qCheck()">확인</button>'}`;
 if(a){const diff=!a.ok&&q.type==='input'?[...a.val].map((c,i)=>c===w.h[i]?c:`<span class="bd">${esc(c)}</span>`).join(''):'';
  h+=`<div class="fb ${a.ok?'ok':'no'}"><b>${a.ok?'정답!':'오답'}</b>${diff?`<div class="hz han">${diff}</div><div class="ex">내가 쓴 답 (빨간 글자가 틀린 부분)</div>`:''}
  <div class="hz han">${esc(w.h)}</div><div class="py">${esc(w.p)}</div><div class="ex han">${esc(w.e)}</div></div>
  <button class="btn pri" id="nx" onclick="qNext()">${q.i+1<q.pool.length?'다음 문제':'결과 보기'}</button>`}
 else if(q.type==='input')h+=padHTML();
 $('#main').innerHTML=h;const el=$('#ans');if(el&&!a)el.focus();const nx=$('#nx');if(nx)nx.focus()}
function distract(w){const sc=o=>{let s=0;for(const c of o.h)if(w.h.includes(c))s+=3;if(o.h.length===w.h.length)s+=2;return s+Math.random()};
 const r=[...(w.x||[])];V.filter(o=>o.h!==w.h).sort((a,b)=>sc(b)-sc(a)).forEach(o=>{if(r.length<3&&!r.includes(o.h))r.push(o.h)});return r.slice(0,3)}
function qPrep(){const q=S.q,w=q.pool[q.i];q.ans=null;if(q.type==='choice')q.opts=shuf([w.h,...distract(w)])}
function qStart(){const q=S.q;q.pool=shuf(pool(q.wrongOnly));
 if(!q.pool.length){alert(q.wrongOnly?'오답 노트가 비어 있어요.':'단어가 없어요.');return}
 if(q.type==='choice'&&V.length<4){alert('객관식은 단어가 4개 이상 필요해요.');return}
 q.i=0;q.ok=0;q.phase='play';qPrep();render()}
function qCheck(i){const q=S.q,w=q.pool[q.i];let v;
 if(q.type==='choice')v=q.opts[i];else{v=$('#ans').value.replace(/\s/g,'');if(!v)return}
 const ok=v===w.h;q.ans={val:v,ok};
 if(ok){q.ok++;if(q.wrongOnly)delete W[w.h]}else W[w.h]=(W[w.h]||0)+1;sv(KW,W);render()}
function qNext(){const q=S.q;if(q.i+1>=q.pool.length)q.phase='end';else{q.i++;qPrep()}render()}
/* 오답 노트 */
function rWrong(){const l=V.filter(w=>W[w.h]).sort((a,b)=>W[b.h]-W[a.h]);
 if(!l.length){$('#main').innerHTML='<div class="empty">오답 노트가 비어 있어요. 틀린 한자는 자동으로 여기에 모여요.</div>';return}
 $('#main').innerHTML=`<div class="btns"><button class="btn pri" onclick="S.q.wrongOnly=true;S.q.phase='setup';go('quiz')">오답으로 퀴즈</button><button class="btn" onclick="fcStart(true);go('card')">오답 플래시카드</button><button class="btn bad" onclick="if(confirm('오답 노트를 모두 비울까요?')){W={};sv(KW,W);render()}">모두 비우기</button></div>`+
 l.map(w=>`<div class="row"><div class="hz han">${esc(w.h)}</div><div class="m"><b>${esc(w.p)}</b><br>${esc(w.m)}</div><span class="ex">${W[w.h]}회</span><button class="x" aria-label="삭제" onclick="delete W['${w.h.replace(/'/g,"\\'")}'];sv(KW,W);render()">×</button></div>`).join('')}
/* 단어 관리 */
function rManage(){$('#main').innerHTML=`<p class="ex">한 줄에 한 단어: <b>한자|병음|뜻|예문|헷갈리는한자(/로 구분)|범위(선택)</b><br>탭이나 쉼표로 구분해도 돼요. 헷갈리는 한자를 적으면 객관식 보기로 나와요.</p>
 <textarea id="imp" lang="zh" placeholder="图书馆|túshūguǎn|도서관|我在图书馆看书。|图书官/困书馆"></textarea>
 <div class="btns"><label><input type="radio" name="mode" value="add" checked>추가</label><label><input type="radio" name="mode" value="rep">전체 교체</label>
 <button class="btn pri" onclick="doImport()">가져오기</button><button class="btn" onclick="$('#imp').value=V.map(w=>[w.h,w.p,w.m,w.e,(w.x||[]).join('/'),w.g||''].join('|')).join('\\n')">현재 단어 내보내기</button></div>
 <div class="btns"><button class="btn good" onclick="resetV(false)">삭제한 기본 단어 복구</button><button class="btn bad" onclick="resetV(true)">전체 초기화</button></div>
 <p><b>단어 ${V.length}개</b></p>`+V.map((w,i)=>`<div class="row"><div class="hz han">${esc(w.h)}</div><div class="m"><b>${esc(w.p)}</b><br>${esc(w.m)}</div><button class="x" aria-label="삭제" onclick="delWord(${i})">×</button></div>`).join('')}
function doImport(){const t=$('#imp').value.trim();if(!t)return;
 const rows=parseRows(t);
 if(!rows.length){alert('인식된 줄이 없어요.');return}
 if(document.querySelector('input[name=mode]:checked').value==='rep'){if(!confirm('기존 단어와 오답 노트를 모두 지우고 교체할까요?'))return;V=rows;W={}}
 else rows.forEach(r=>{const k=V.findIndex(v=>v.h===r.h);k>=0?V[k]=r:V.push(r)});
 sv(KV,V);sv(KW,W);render()}
function resetV(full){const d=parseRows(SEED);
 if(full){if(!confirm('모든 단어를 기본 단어로 되돌리고 오답 노트도 비울까요?'))return;V=d;W={}}
 else{const have=new Set(V.map(w=>w.h));const add=d.filter(w=>!have.has(w.h));V=V.concat(add);alert(add.length?add.length+'개 단어를 복구했어요.':'복구할 기본 단어가 없어요.')}
 sv(KV,V);sv(KW,W);S.unit='';fcStart();render()}
function delWord(i){if(!confirm(V[i].h+' 단어를 삭제할까요? (삭제한 기본 단어는 복구할 수 있어요)'))return;delete W[V[i].h];V.splice(i,1);sv(KV,V);sv(KW,W);render()}
/* 손글씨 연습 */
function padHTML(){return `<details class="pad" ${S.pad?'open':''} ontoggle="S.pad=this.open;initCanvas()"><summary>손으로 써보기</summary><canvas id="cv" height="220"></canvas><button class="btn" onclick="initCanvas(true)">지우기</button></details>`}
function initCanvas(clear){const c=$('#cv');if(!c)return;const w=c.clientWidth;if(w&&(c.width!==w||clear))c.width=w;
 const x=c.getContext('2d');x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.body).color;let d=false;
 const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>d=false}
render();
</script></body></html>
